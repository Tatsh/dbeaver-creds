jobs:
  asan-test:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 'Install dependencies'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcmocka-dev libssl-dev
      - name: 'Configure'
        run: >-
          cmake -B ${{ github.workspace }}/build
          -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}
          -DBUILD_TESTS=ON -DENABLE_ASAN=ON -DENABLE_UBSAN=ON
      - name: 'Build'
        run: 'cmake --build ${{ github.workspace }}/build --verbose'
      - name: 'Run tests'
        run: 'ctest --test-dir ${{ github.workspace }}/build --output-on-failure --verbose'
    strategy:
      fail-fast: false
      matrix:
        build-type:
          - 'Debug'
          - 'RelWithDebInfo'
  coveralls-finish:
    if: 'always()'
    needs:
      - 'native'
      - 'native-windows'
      - 'pwsh-test'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Coveralls finished'
        uses: 'coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329'
        with:
          parallel-finished: true
  native:
    env:
      HOMEBREW_NO_REQUIRE_TAP_TRUST: '1'
    runs-on: '${{ matrix.os }}'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: "runner.os == 'Linux'"
        name: 'Install dependencies (Linux)'
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov libcmocka-dev libssl-dev
      - if: "runner.os == 'macOS'"
        name: 'Install dependencies (macOS)'
        run: 'brew install cmocka lcov openssl@3'
      - name: 'Configure'
        run: >-
          cmake -B ${{ github.workspace }}/build
          -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}
          -DBUILD_TESTS=ON -DENABLE_COVERAGE=ON
      - name: 'Build'
        run: 'cmake --build ${{ github.workspace }}/build --verbose'
      - name: 'Run tests'
        run: 'ctest --test-dir ${{ github.workspace }}/build --output-on-failure --verbose'
      - if: "matrix.build-type == 'Debug'"
        name: 'Drop test-source coverage data'
        run: |
          find ${{ github.workspace }}/build -name 'test_*.c.gcda' -delete
          find ${{ github.workspace }}/build -name 'wrappers.c.gcda' -delete
      - if: "matrix.build-type == 'Debug'"
        name: 'Generate coverage information'
        run: >-
          lcov --capture --directory ${{ github.workspace }}/build
          --output-file ${{ github.workspace }}/coverage.lcov
          --ignore-errors inconsistent,format,unsupported
      - if: "matrix.build-type == 'Debug'"
        name: 'Coveralls'
        uses: 'coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329'
        with:
          file: '${{ github.workspace }}/coverage.lcov'
          flag-name: 'native-${{ runner.os }}'
          parallel: true
    strategy:
      fail-fast: false
      matrix:
        build-type:
          - 'Debug'
          - 'Release'
        os:
          - 'macos-latest'
          - 'ubuntu-latest'
  native-windows:
    runs-on: '${{ matrix.os }}'
    steps:
      - id: 'fixed_workspace'
        name: 'Fix path'
        run: >-
          echo out=$("${{ github.workspace }}" -Replace "\\","/") | Out-File
          -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: 'msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884'
        with:
          install: 'make'
          msystem: '${{ matrix.msystem }}'
          pacboy: >-
            cmake:p
            cmocka:p
            lcov:p
            ninja:p
            openssl:p
            toolchain:p
          update: true
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          WORKSPACE: '${{ steps.fixed_workspace.outputs.out }}'
        name: 'Configure'
        run: >-
          cmake -G Ninja -B "${WORKSPACE}/build"
          -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}
          -DBUILD_TESTS=ON -DENABLE_COVERAGE=ON
        shell: 'msys2 {0}'
      - env:
          WORKSPACE: '${{ steps.fixed_workspace.outputs.out }}'
        name: 'Build'
        run: 'cmake --build "${WORKSPACE}/build" --verbose'
        shell: 'msys2 {0}'
      - env:
          WORKSPACE: '${{ steps.fixed_workspace.outputs.out }}'
        name: 'Run tests'
        run: >-
          ctest --test-dir "${WORKSPACE}/build"
          --output-on-failure --verbose
        shell: 'msys2 {0}'
      - env:
          WORKSPACE: '${{ steps.fixed_workspace.outputs.out }}'
        if: "matrix.build-type == 'Debug'"
        name: 'Drop test-source coverage data'
        run: |
          find "${WORKSPACE}/build" -name 'test_*.c.gcda' -delete
          find "${WORKSPACE}/build" -name 'wrappers.c.gcda' -delete
        shell: 'msys2 {0}'
      - env:
          WORKSPACE: '${{ steps.fixed_workspace.outputs.out }}'
        if: "matrix.build-type == 'Debug'"
        name: 'Generate coverage information'
        run: >-
          lcov --capture --directory "${WORKSPACE}/build"
          --output-file coverage.lcov
        shell: 'msys2 {0}'
      - if: "matrix.build-type == 'Debug'"
        name: 'Coveralls'
        uses: 'coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329'
        with:
          file: 'coverage.lcov'
          flag-name: 'native-Windows-${{ matrix.msystem }}'
          parallel: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - build-type: 'Debug'
            msystem: 'MINGW64'
            os: 'windows-latest'
          - build-type: 'Release'
            msystem: 'MINGW64'
            os: 'windows-latest'
          - build-type: 'Debug'
            msystem: 'CLANGARM64'
            os: 'windows-11-arm'
          - build-type: 'Release'
            msystem: 'CLANGARM64'
            os: 'windows-11-arm'
  pwsh-test:
    runs-on: 'windows-latest'
    steps:
      - name: 'Checkout code'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - name: 'Run Pester Tests'
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = "."
          $config.CodeCoverage.Enabled = $true
          $config.TestResult.Enabled = $true
          $config.CodeCoverage.Path = ".\DBeaverCreds\DBeaverCreds.psm1"
          Invoke-Pester -Configuration $config
      - name: 'Report Coveralls'
        uses: 'coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329'
        with:
          flag-name: 'pwsh'
          parallel: true
name: 'Tests'
'on':
  pull_request:
    branches:
      - 'master'
  push:
    branches:
      - 'master'
permissions:
  contents: 'read'
