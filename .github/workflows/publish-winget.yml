concurrency:
  cancel-in-progress: false
  group: '${{ github.workflow }}-${{ github.event.workflow_run.head_sha }}'
  queue: 'max'
jobs:
  check:
    if: "github.event.workflow_run.conclusion == 'success'"
    name: 'Find Release'
    outputs:
      has_installer_assets: '${{ steps.check_assets.outputs.has_installer_assets }}'
      has_winget_token: '${{ steps.check_secret.outputs.has_winget_token }}'
      tag: '${{ steps.release.outputs.tag }}'
    runs-on: 'ubuntu-latest'
    steps:
      - env:
          GH_TOKEN: '${{ github.token }}'
          HEAD_SHA: '${{ github.event.workflow_run.head_sha }}'
          REPO: '${{ github.repository }}'
        id: 'release'
        name: 'Find the published release for this commit'
        run: |
          tag=''
          while IFS=$'\t' read -r ref obj_type obj_sha; do
            [[ -z "$ref" ]] && continue
            if [[ "$obj_type" == 'commit' ]]; then
              target_sha="$obj_sha"
            else
              target_sha=$(gh api "repos/${REPO}/git/tags/${obj_sha}" \
                --jq '.object.sha' 2>/dev/null || echo '')
            fi
            if [[ "$target_sha" == "$HEAD_SHA" ]]; then
              tag="${ref#refs/tags/}"
              break
            fi
          done < <(gh api "repos/${REPO}/git/matching-refs/tags/v" \
            --jq '.[] | [.ref, .object.type, .object.sha] | @tsv')
          if [[ -z "$tag" ]]; then
            echo "No v* tag points at ${HEAD_SHA}, nothing to do."
            exit 0
          fi
          unpublished=$(gh release view "$tag" --repo "$REPO" --json isDraft,isPrerelease \
            --jq '.isDraft or .isPrerelease' 2>/dev/null || echo 'true')
          if [[ "$unpublished" != 'false' ]]; then
            echo "Release ${tag} is not published, nothing to do."
            exit 0
          fi
          echo "Found published release ${tag}."
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - env:
          WINGET_TOKEN: '${{ secrets.WINGET_TOKEN }}'
        id: 'check_secret'
        name: 'Check WINGET_TOKEN is set'
        run: |
          if [[ -n "$WINGET_TOKEN" ]]; then
            echo 'has_winget_token=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_winget_token=false' >> "$GITHUB_OUTPUT"
            echo '::warning::WINGET_TOKEN secret is empty; the update-winget job will be skipped.'
          fi
      - env:
          GH_TOKEN: '${{ github.token }}'
          REPO: '${{ github.repository }}'
          TAG: '${{ steps.release.outputs.tag }}'
        id: 'check_assets'
        if: "steps.release.outputs.tag != ''"
        name: 'Check release has installer assets'
        run: |
          count=$(gh release view --repo "$REPO" "$TAG" --json assets \
            --jq '[.assets[].name | select(test("\\.(exe|msi|msix|appx)(bundle)?$"; "i"))] | length' \
            || echo 0)
          if [[ "$count" -gt 0 ]]; then
            echo 'has_installer_assets=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_installer_assets=false' >> "$GITHUB_OUTPUT"
            echo "::warning::Release ${TAG} has no installer assets; skipping update-winget."
          fi
  update-winget:
    if: "needs.check.outputs.has_winget_token == 'true' && needs.check.outputs.has_installer_assets == 'true'"
    name: 'Update WinGet'
    needs:
      - 'check'
    runs-on: 'windows-latest'
    steps:
      - uses: 'vedantmgoyal9/winget-releaser@a8fff44b123f115ce4c21543edf8b677376fc7e0'
        with:
          identifier: 'Tatsh.dbeaver-creds'
          max-versions-to-keep: 3
          release-tag: '${{ needs.check.outputs.tag }}'
          token: '${{ secrets.WINGET_TOKEN }}'
name: 'Publish to WinGet'
'on':
  workflow_run:
    types:
      - 'completed'
    workflows:
      - 'Release'
permissions:
  contents: 'read'
