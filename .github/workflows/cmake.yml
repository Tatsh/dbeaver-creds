concurrency:
  cancel-in-progress: false
  group: '${{ github.workflow }}-${{ github.ref }}'
  queue: 'max'
jobs:
  build:
    name: 'Build'
    permissions:
      contents: 'write'
    runs-on: '${{ matrix.os }}'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - if: "runner.os == 'Linux'"
        name: 'Install dependencies (Linux)'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev
      - if: "runner.os == 'macOS'"
        name: 'Install dependencies (macOS)'
        run: 'brew install openssl@3'
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
        if: "runner.os != 'Windows'"
        name: 'Configure'
        run: >-
          cmake -B "$GITHUB_WORKSPACE/build"
          -DCMAKE_BUILD_TYPE="$BUILD_TYPE"
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
        if: "runner.os == 'Windows'"
        name: 'Configure (Windows)'
        run: >-
          cmake -B "$env:GITHUB_WORKSPACE/build"
          "-DCMAKE_BUILD_TYPE=$env:BUILD_TYPE"
        shell: 'pwsh'
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
        if: "runner.os != 'Windows'"
        name: 'Build'
        run: >-
          cmake --build "$GITHUB_WORKSPACE/build"
          --config "$BUILD_TYPE" --verbose
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
        if: "runner.os == 'Windows'"
        name: 'Build (Windows)'
        run: >-
          cmake --build "$env:GITHUB_WORKSPACE/build"
          --config "$env:BUILD_TYPE" --verbose
        shell: 'pwsh'
      - name: 'Set up Python'
        uses: 'actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97'
        with:
          python-version: '3.x'
      - name: 'Install Python build tooling'
        run: 'python -m pip install --upgrade build'
      - name: 'Build Python wheel'
        run: 'python -m build --wheel'
      - name: 'Stage artifacts'
        shell: 'bash'
        run: |
          set -e
          mkdir -p stage
          cp dist/*.whl stage/
          bin=$(find "${GITHUB_WORKSPACE}/build/src" -maxdepth 2 -name 'dbeaver-creds' -o -name 'dbeaver-creds.exe' | head -1)
          if [ -n "$bin" ]; then cp "$bin" stage/; fi
      # Release binaries link the release CRT. The scan below reports markers
      # such as VCRUNTIME140D or ucrtbased and fails the job when the staged
      # executable or the extension module in the wheel references a debug
      # runtime.
      - if: "matrix.build-type == 'Release' && runner.os == 'Windows'"
        name: 'Check for debug runtime linkage'
        shell: 'pwsh'
        run: |
          $markers = @(
            'VCRUNTIME140D',
            'MSVCP140D',
            'VCOMP140D',
            'CONCRT140D',
            'VCCORLIB140D',
            'ucrtbased',
            'MSVCRTD',
            'MSVCPRTD'
          )
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          Get-ChildItem stage/*.whl | ForEach-Object {
            [System.IO.Compression.ZipFile]::ExtractToDirectory($_.FullName, 'wheelcheck', $true)
          }
          $binaries = @(Get-ChildItem stage/*.exe) +
            @(Get-ChildItem wheelcheck -Recurse -Include *.dll, *.pyd)
          if ($binaries.Count -eq 0) {
            Write-Host '::error::No release binaries found to scan.'
            exit 1
          }
          $failed = $false
          $binaries | ForEach-Object {
            $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
            $text = [System.Text.Encoding]::ASCII.GetString($bytes)
            foreach ($marker in $markers) {
              if ($text.Contains($marker)) {
                Write-Host "::error::$($_.Name) references debug runtime $marker."
                $failed = $true
              }
            }
          }
          if ($failed) {
            exit 1
          }
      - name: 'Upload workflow artifacts'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          if-no-files-found: 'error'
          name: 'dbeaver-creds-${{ matrix.os }}-${{ matrix.build-type }}'
          path: 'stage/*'
      - if: "matrix.build-type == 'Release' && github.ref_type == 'tag' && runner.os == 'Windows'"
        name: 'Install NSIS'
        shell: 'pwsh'
        run: 'choco install nsis -y --no-progress'
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
        if: "matrix.build-type == 'Release' && github.ref_type == 'tag' && runner.os != 'Linux'"
        name: 'Generate release packages via CPack'
        shell: 'bash'
        run: |
          set -e
          mkdir -p "${GITHUB_WORKSPACE}/release-stage"
          (cd "${GITHUB_WORKSPACE}/build" && \
            cpack -C "${BUILD_TYPE}" \
                  -B "${GITHUB_WORKSPACE}/release-stage")
      - env:
          GH_TOKEN: '${{ github.token }}'
          TAG: '${{ github.ref_name }}'
        if: "matrix.build-type == 'Release' && github.ref_type == 'tag' && runner.os != 'Linux'"
        name: 'Attach Release artifacts to draft GitHub release'
        run: |
          set -e
          shopt -s failglob
          files=(release-stage/dbeaver-creds-*)
          gh release view "${TAG}" >/dev/null 2>&1 ||
            gh release create "${TAG}" --draft --title "${TAG}" --notes '' || true
          gh release upload "${TAG}" "${files[@]}" --clobber
        shell: 'bash'
    strategy:
      fail-fast: false
      matrix:
        build-type:
          - 'Debug'
          - 'Release'
        os:
          - 'macos-15-intel'
          - 'macos-latest'
          - 'ubuntu-24.04-arm'
          - 'ubuntu-latest'
          - 'windows-11-arm'
          - 'windows-latest'
name: 'Build'
'on':
  pull_request:
    branches:
      - 'master'
    paths:
      - '**/*.c'
      - '**/*.h'
      - '**/*.py'
      - '**/CMakeLists.txt'
      - '.github/workflows/cmake.yml'
      - 'pyproject.toml'
  push:
    branches:
      - 'master'
    paths:
      - '**/*.c'
      - '**/*.h'
      - '**/*.py'
      - '**/CMakeLists.txt'
      - '.github/workflows/cmake.yml'
      - 'pyproject.toml'
    tags:
      - 'v*'
permissions: {}
