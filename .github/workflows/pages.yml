jobs:
  documentation:
    name: Documentation
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz
      - name: Configure
        run: cmake -DCMAKE_BUILD_TYPE=Release -B "$GITHUB_WORKSPACE/build" -DBUILD_DOCS=ON
      - name: Build documentation
        run: cmake --build "$GITHUB_WORKSPACE/build" --target docs --verbose
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found: error
          name: documentation
          path: build/html
  publish:
    concurrency:
      cancel-in-progress: false
      group: pages
      queue: max
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    name: Publish reports and documentation
    needs:
      - documentation
    permissions:
      id-token: write
      pages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: scan-build-${{ github.sha }}
          path: _report
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: documentation
          path: _documentation
      - name: Assemble site with latest report
        run: |
          mkdir -p _site
          if [ -d _documentation ]; then
            cp -a _documentation/. _site/
          fi
          rm -rf _site/scan-build
          mkdir -p _site/scan-build
          cp -a _report/. _site/scan-build/
          python3 - <<'PY'
          from pathlib import Path

          root = Path('_site')
          if not (root / 'index.html').exists():
              (root / 'index.html').write_text(
                  '<!doctype html><html lang="en"><meta charset="utf-8">'
                  '<title>Clang static analysis</title>'
                  '<a href="scan-build/">Clang static analysis reports</a>', encoding='utf-8')
          (root / '.nojekyll').touch()
          PY
          tar --dereference --hard-dereference -cf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git -C _site .
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          if-no-files-found: error
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
      - id: deployment
        name: Deploy Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
      - env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        name: Report URL
        run: echo "[Clang report](${PAGE_URL}scan-build/)" >> "$GITHUB_STEP_SUMMARY"
name: Pages
'on':
  workflow_call: {}
permissions: {}
