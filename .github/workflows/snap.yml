jobs:
  build:
    runs-on: '${{ matrix.system.image }}'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - id: 'build'
        name: 'Build Snap package'
        uses: 'snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79'
        with:
          snapcraft-args: 'pack'
          snapcraft-channel: 'latest/stable'
      - name: 'Upload Artifacts'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          if-no-files-found: 'error'
          name: 'dbeaver-creds-snap-${{ matrix.system.arch }}'
          path: '*.snap'
      - name: 'Attest'
        uses: 'actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6'
        with:
          subject-path: '*.snap'
      - env:
          GH_TOKEN: '${{ github.token }}'
          TAG: '${{ github.ref_name }}'
        if: "github.ref_type == 'tag'"
        name: 'Upload package'
        run: |
          set -e
          shopt -s failglob
          files=(*.snap)
          gh release view "${TAG}" >/dev/null 2>&1 ||
            gh release create "${TAG}" --draft --title "${TAG}" --notes '' || true
          gh release upload "${TAG}" "${files[@]}" --clobber
        shell: 'bash'
    strategy:
      matrix:
        system:
          - arch: 'amd64'
            image: 'ubuntu-24.04'
          - arch: 'arm64'
            image: 'ubuntu-24.04-arm'
name: 'Snap'
'on':
  push:
    branches:
      - 'master'
    paths:
      - '**/*.c'
      - '**/*.h'
      - '**/CMakeLists.txt'
      - '.github/workflows/snap.yml'
      - 'snapcraft.yaml'
    tags:
      - 'v*'
  workflow_dispatch: null
permissions:
  attestations: 'write'
  contents: 'write'
  id-token: 'write'
