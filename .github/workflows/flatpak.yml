concurrency:
  cancel-in-progress: false
  group: '${{ github.workflow }}-${{ github.ref }}'
  queue: 'max'
jobs:
  build:
    container:
      image: 'ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08@sha256:66eb59fd5d923833e8e4142f60e542156aad4b8b1d5db38149d814c659e274bc'
      options: '--privileged'
    name: 'Build'
    permissions:
      attestations: 'write'
      contents: 'write'
      id-token: 'write'
    runs-on: '${{ matrix.system.image }}'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - env:
          ARCH: '${{ matrix.system.arch }}'
        id: 'flatpak_bundle'
        name: 'Set Flatpak bundle filename'
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "filename=sh.tat.dbeaver-creds-${version}-${ARCH}.flatpak" >> "$GITHUB_OUTPUT"
      - name: 'Build Flatpak'
        uses: 'flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3'
        with:
          arch: '${{ matrix.system.arch }}'
          bundle: '${{ steps.flatpak_bundle.outputs.filename }}'
          manifest-path: 'sh.tat.dbeaver-creds.yml'
      - name: 'Upload Artifacts'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          if-no-files-found: 'error'
          name: 'sh.tat.dbeaver-creds-${{ steps.flatpak_bundle.outputs.version }}-${{ matrix.system.arch }}'
          path: '${{ steps.flatpak_bundle.outputs.filename }}'
      - name: 'Attest'
        uses: 'actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6'
        with:
          subject-path: '${{ steps.flatpak_bundle.outputs.filename }}'
      - env:
          FILENAME: '${{ steps.flatpak_bundle.outputs.filename }}'
          GH_TOKEN: '${{ github.token }}'
          TAG: '${{ github.ref_name }}'
        if: "github.ref_type == 'tag'"
        name: 'Upload package'
        run: |
          set -e
          test -f "${FILENAME}"
          gh release view "${TAG}" >/dev/null 2>&1 ||
            gh release create "${TAG}" --draft --title "${TAG}" --notes '' || true
          gh release upload "${TAG}" "${FILENAME}" --clobber
        shell: 'bash'
    strategy:
      matrix:
        system:
          - arch: 'x86_64'
            image: 'ubuntu-latest'
          - arch: 'aarch64'
            image: 'ubuntu-24.04-arm'
name: 'Flatpak'
'on':
  push:
    branches:
      - 'master'
    paths:
      - '**/*.c'
      - '**/*.h'
      - '**/CMakeLists.txt'
      - '.github/workflows/flatpak.yml'
      - 'sh.tat.dbeaver-creds.yml'
      - 'pyproject.toml'
    tags:
      - 'v*'
  workflow_dispatch: null
permissions: {}
